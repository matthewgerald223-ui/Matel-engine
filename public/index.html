<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matel | Independent Search Engine by Ekpah Matthew</title>
    
    <!-- SEO Meta Tags for Google Indexing -->
    <meta name="description" content="Matel is a lightweight, fast web search engine created by Ekpah Matthew (Matthew Gerald) featuring instant math calculations, direct website shortcuts, and quick web lookups.">
    <meta name="keywords" content="Matel, Matel search engine, Matel engine, Ekpah Matthew, Matthew Gerald, web search engine, independent search engine">
    <meta name="author" content="Ekpah Matthew">
    <meta name="robots" content="index, follow">

    <!-- Open Graph for Social Media Link Sharing -->
    <meta property="og:title" content="Matel | Independent Search Engine by Ekpah Matthew">
    <meta property="og:description" content="Fast, lightweight search engine developed by Ekpah Matthew.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://matel-engine.onrender.com">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body {
            background-color: #121318;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 80px;
        }
        .app-container {
            width: 100%;
            max-width: 500px;
            padding: 15px;
            display: flex;
            flex-direction: column;
        }
        .logo {
            font-size: 42px;
            font-weight: 900;
            text-align: center;
            color: #00ffcc;
            margin: 30px 0 5px;
            letter-spacing: 2px;
        }
        .tagline {
            text-align: center;
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 25px;
        }
        .search-box-container {
            display: flex;
            background: #1e2028;
            border-radius: 30px;
            padding: 6px;
            border: 1px solid #2a2d3d;
            margin-bottom: 20px;
        }
        .search-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #f8fafc;
            padding: 12px 16px;
            font-size: 16px;
        }
        .search-btn {
            background: #00ffcc;
            color: #121318;
            border: none;
            padding: 0 24px;
            border-radius: 24px;
            font-weight: bold;
            cursor: pointer;
        }
        .results-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .result-card {
            background: #1e2028;
            border: 1px solid #2a2d3d;
            border-radius: 16px;
            padding: 16px;
            text-decoration: none;
            color: inherit;
            display: block;
            transition: border-color 0.2s;
        }
        .result-card:hover {
            border-color: #00ffcc;
        }
        .result-title {
            font-size: 18px;
            color: #38bdf8;
            margin-bottom: 6px;
            font-weight: 600;
        }
        .result-snippet {
            font-size: 14px;
            color: #94a3b8;
            line-height: 1.4;
            margin-bottom: 8px;
        }
        .result-url {
            font-size: 12px;
            color: #34d399;
            word-break: break-all;
        }
        .instant-answer {
            background: #1e2028;
            border: 1px solid #00ffcc;
            border-radius: 16px;
            padding: 20px;
            font-size: 22px;
            text-align: center;
            color: #00ffcc;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .footer-credit {
            margin-top: 30px;
            font-size: 12px;
            color: #64748b;
            text-align: center;
        }
        .footer-credit strong {
            color: #00ffcc;
        }
        .nav-bar {
            position: fixed;
            bottom: 0;
            width: 100%;
            max-width: 500px;
            background: #121318;
            border-top: 1px solid #2a2d3d;
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
        }
        .nav-item {
            color: #94a3b8;
            text-align: center;
            font-size: 11px;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="logo">MATEL</div>
        <div class="tagline">www.matel.com</div>
        
        <div class="search-box-container">
            <input type="text" id="searchInput" class="search-input" placeholder="Search anything or calculate...">
            <button id="searchBtn" class="search-btn">Go</button>
        </div>

        <div id="resultsArea" class="results-container"></div>

        <div class="footer-credit">
            Created & Developed by <strong>Ekpah Matthew</strong>
        </div>
    </div>

    <div class="nav-bar">
        <a href="#" class="nav-item">Home</a>
        <a href="#" class="nav-item">Search</a>
        <a href="#" class="nav-item">Alerts</a>
        <a href="#" class="nav-item">Activity</a>
    </div>

    <script>
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const resultsArea = document.getElementById('resultsArea');

        async function performSearch() {
            const query = searchInput.value.trim();
            if (!query) return;

            resultsArea.innerHTML = '<div style="text-align:center; color:#94a3b8; padding:20px;">Searching...</div>';

            try {
                const res = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
                const data = await res.json();

                resultsArea.innerHTML = '';

                if (data.type === 'instant') {
                    resultsArea.innerHTML = `<div class="instant-answer">${data.answer}</div>`;
                    return;
                }

                if (!data.results || data.results.length === 0) {
                    resultsArea.innerHTML = '<div style="text-align:center; color:#94a3b8; padding:20px;">No direct search results found</div>';
                    return;
                }

                data.results.forEach(item => {
                    const card = document.createElement('a');
                    card.href = item.url;
                    card.target = '_blank';
                    card.className = 'result-card';
                    card.innerHTML = `
                        <div class="result-title">${item.title}</div>
                        <div class="result-snippet">${item.snippet}</div>
                        <div class="result-url">${item.url}</div>
                    `;
                    resultsArea.appendChild(card);
                });

            } catch (err) {
                console.error(err);
                resultsArea.innerHTML = '<div style="text-align:center; color:#ef4444; padding:20px;">Failed to fetch search results.</div>';
            }
        }

        searchBtn.addEventListener('click', performSearch);
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') performSearch();
        });
    </script>
</body>
</html>
